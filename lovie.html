  <style>
    :root{
      --bg:#faf8ff;
      --card:#ffffff;
      --ink:#2b2541;
      --muted:#6b6490;
      --brand:#ff9cbe;
      --line:#ffe0ec;
      --soft:#fff2f7;
      --radius:16px;
      --shadow:0 8px 24px rgba(71,36,140,.08);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color:var(--ink)
    }
    .lang-switch{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      gap:8px;
      justify-content:center;
      flex-wrap:wrap;
      padding:12px;
      background:rgba(250,248,255,.84);
      backdrop-filter:blur(10px);
    }
    .lang-btn{
      border:1px solid var(--line);
      background:#fff;
      color:var(--muted);
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      cursor:pointer;
    }
    .lang-btn.active{
      background:linear-gradient(135deg,#ff6b6b,#ff9cbf);
      color:#fff;
      border-color:transparent;
    }
    .wrap{max-width:560px;margin:0 auto;padding:12px 12px 96px;}
    .hero{
      background:#ffe9f2;
      border-radius:24px;
      padding:20px;
      box-shadow:var(--shadow);
    }
    .hero h1{margin:0 0 8px;font-size:28px;line-height:1.2}
    .hero p{margin:8px 0;color:var(--muted)}
    .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}
    section{margin:14px 0}
    .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .sec-title{display:flex;align-items:center;gap:8px;margin:0 0 10px}
    .sec-title .dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
    .steps{display:grid;gap:12px}
    .step{
      display:grid;
      grid-template-columns:32px 1fr;
      gap:10px;
      background:var(--soft);
      border:1px dashed #ffd3e3;
      border-radius:14px;
      padding:12px;
    }
    .num{
      width:28px;height:28px;border-radius:8px;background:var(--brand);
      color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700
    }
    .step p,.mini{margin:0;font-size:13px;line-height:1.65;color:var(--muted)}
    .step b,.plain{color:var(--ink)}
    .pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px}
    .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .divider{height:1px;background:var(--line);margin:10px 0}
    .platforms{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .platform{
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      padding:12px;
      text-align:center;
      font-size:13px;
      font-weight:700;
    }
    .tips{display:grid;gap:10px}
    .tip-card{border:1px solid #eee;border-radius:14px;padding:12px;background:#fff}
    .tip-card h4{margin:0 0 6px;font-size:14px}
    .tip-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.65}
    .shots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .shot{border-radius:14px;overflow:hidden;border:1px solid #eee;background:#fff}
    .shot img{width:100%;height:auto;display:block;aspect-ratio:3/4;object-fit:cover}
    .list{display:grid;gap:8px}
    .li{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #eee;border-radius:12px;background:#fff}
    .li .i{font-size:18px;line-height:1.2}
    .copyable{user-select:all}
    .sticky{position:fixed;left:0;right:0;bottom:12px;z-index:10;display:flex;justify-content:center;pointer-events:none}
    .dock{width:min(560px,100% - 24px);pointer-events:auto;display:flex;justify-content:center}
    .btn{
      appearance:none;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
      padding:13px 18px;border-radius:14px;font-weight:700;min-width:70%;
      background:linear-gradient(135deg,#ff6b6b,#ff9cbf);color:#fff;
      box-shadow:0 8px 20px rgba(255,107,107,.35);
    }
    .hidden{display:none !important}
  </style>
</head>

      function normalizeLang(lang) {
        if (!lang) return 'en';
        var lower = lang.toLowerCase();
        if (lower.indexOf('zh') === 0) {
          return /tw|hk|hant/.test(lower) ? 'zh-TW' : 'zh-CN';
        }
        if (lower.indexOf('ja') === 0) return 'ja';
        if (lower.indexOf('ko') === 0) return 'ko';
        return 'en';
      }

      function detectLang() {
        var fromQuery = new URLSearchParams(window.location.search).get('lang');
        var saved = localStorage.getItem(STORAGE_KEY);
        var browser = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        return normalizeLang(fromQuery || saved || browser);
      }

      function renderArray(containerId, items, className) {
        document.getElementById(containerId).innerHTML = items.map(function (item) {
          return '<div class="' + className + '">' + item + '</div>';
        }).join('');
      }

      function renderHashtags(items) {
        document.getElementById('hashtags').innerHTML = items.map(function (item) {
          return '<span class="pill copyable">' + item + '</span>';
        }).join('');
      }

      function renderCards(containerId, items) {
        document.getElementById(containerId).innerHTML = items.map(function (item) {
          return '<div class="tip-card"><h4>' + item.title + '</h4><p>' + item.body + '</p></div>';
        }).join('');
      }

      function setMeta(dict, lang) {
        document.documentElement.lang = lang;
        document.title = dict.pageTitle;
        document.querySelector('meta[name="description"]').setAttribute('content', dict.pageDescription);
      }

      function applyLanguage(lang) {
        var dict = translations[lang] || translations.en;
        var isChinese = lang === 'zh-CN' || lang === 'zh-TW';
        localStorage.setItem(STORAGE_KEY, lang);
        setMeta(dict, lang);

        document.querySelectorAll('[data-i18n]').forEach(function (node) {
          node.textContent = dict[node.getAttribute('data-i18n')] || '';
        });

        renderArray('rewardBadges', dict.rewards, 'badge');
        renderArray('platformList', dict.platforms, 'platform');
        renderHashtags(dict.hashtags);
        renderCards('ideaCards', dict.ideas);
        renderCards('globalExampleCards', dict.globalExamples);

        document.getElementById('cnExamples').classList.toggle('hidden', !isChinese);
        document.getElementById('globalExamples').classList.toggle('hidden', isChinese);

        document.querySelectorAll('.lang-btn').forEach(function (button) {
          button.classList.toggle('active', button.getAttribute('data-lang') === lang);
        });

        bindCopy();
      }

      function bindCopy() {
        document.querySelectorAll('.copyable').forEach(function (el) {
          el.onclick = async function () {
            try {
              await navigator.clipboard.writeText(el.textContent.trim());
              el.style.boxShadow = '0 0 0 3px rgba(255,156,190,.25) inset';
              setTimeout(function () { el.style.boxShadow = 'none'; }, 600);
            } catch (e) {}
          };
        });
      }

      var initialLang = detectLang();
      applyLanguage(initialLang);

      document.querySelectorAll('.lang-btn').forEach(function (button) {
        button.addEventListener('click', function () {
          var lang = button.getAttribute('data-lang');
          var url = new URL(window.location.href);
          url.searchParams.set('lang', lang);
          window.history.replaceState({}, '', url.toString());
          applyLanguage(lang);
        });
      });
    })();
  </script>
